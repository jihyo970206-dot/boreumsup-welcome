<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Boreumsup Welcome Wine · 满月林</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+SC:wght@600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  /* Layout: one phone-width column — forest "night" hero with a rising full moon, a staff card, a letter under the moon phases, then quiet review links. */
  :root {
    --forest: #1F3A33;
    --forest-deep: #162B26;
    --moon: #C9A86A;
    --wine: #7A2E3A;
    --bg: #F3F5F3;
    --surface: #FFFFFF;
    --ink: #1C2A26;
    --muted: #5A6864;
    --line: #D5DED9;
    --chip: #E6ECE8;
    --done: #2F6B4F;
    --on-forest: #F2F5F3;
    --on-forest-muted: #B9CAC3;
    --display: "Gowun Batang", "Noto Serif SC", "Apple SD Gothic Neo", serif;
    --body: "Noto Sans KR", "Noto Sans SC", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1D19; --surface: #182925; --ink: #E7EEEB; --muted: #A3B4AE;
      --line: #2B403A; --chip: #22362F; --wine: #C77B87; --done: #7CC29E; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1D19; --surface: #182925; --ink: #E7EEEB; --muted: #A3B4AE;
    --line: #2B403A; --chip: #22362F; --wine: #C77B87; --done: #7CC29E; color-scheme: dark;
  }
  html:lang(zh) { --display: "Noto Serif SC", "Gowun Batang", serif; --body: "Noto Sans SC", "Noto Sans KR", system-ui, sans-serif; }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
  html:lang(zh) body { word-break: normal; }
  .wrap { max-width: 440px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; }

  /* hero */
  .hero { background: var(--forest); color: var(--on-forest); margin-inline: -16px; padding: 18px 24px 64px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; inset: auto -20% -40% -20%; height: 60%; background: radial-gradient(ellipse at 50% 0%, rgba(201,168,106,.10), transparent 70%); pointer-events: none; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mark { font-weight: 500; letter-spacing: .32em; font-size: 12px; }
  .mark small { display: block; letter-spacing: .12em; font-size: 11px; color: var(--on-forest-muted); margin-top: 2px; }
  .langs { display: flex; gap: 4px; }
  .langs button { font: 500 12px/1 var(--body); color: var(--on-forest); background: transparent; border: 1px solid rgba(242,245,243,.3); border-radius: 999px; padding: 7px 10px; cursor: pointer; min-width: 40px; }
  .langs button[aria-pressed="true"] { background: var(--moon); border-color: var(--moon); color: var(--forest-deep); font-weight: 700; }
  button:focus-visible, .link:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }

  .moon { width: 64px; height: 64px; border-radius: 50%; margin: 36px 0 22px; background: radial-gradient(circle at 38% 36%, #E3CC98, var(--moon) 58%, #B48F4E); box-shadow: 0 0 0 10px rgba(201,168,106,.12), 0 0 48px 6px rgba(201,168,106,.25); animation: rise 1.4s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { transform: translateY(14px); opacity: .55; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .moon { animation: none; } }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(27px, 7.4vw, 32px); line-height: 1.3; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
  .lead { margin: 12px 0 0; color: var(--on-forest-muted); font-size: 15px; max-width: 30ch; }

  /* staff card */
  .card { background: var(--surface); border-radius: 18px; margin-top: -40px; position: relative; padding: 22px 20px 20px; box-shadow: 0 10px 30px rgba(15,29,25,.16); }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .16em; color: var(--wine); text-transform: uppercase; }
  .card h2 { font-family: var(--display); font-size: 25px; line-height: 1.3; margin: 4px 0 16px; }
  .show { background: var(--forest); color: var(--on-forest); border: 1px solid rgba(201,168,106,.35); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
  .show-title { font-weight: 700; font-size: 16px; }
  .clock { display: grid; gap: 2px; border-top: 1px solid rgba(242,245,243,.18); padding-top: 10px; }
  .clock-label { font-size: 12px; color: var(--on-forest-muted); }
  .clock-time { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 500; letter-spacing: .02em; white-space: nowrap; }
  .staff { width: 100%; font: 700 15px/1.3 var(--body); color: var(--forest-deep); background: var(--moon); border: 0; border-radius: 10px; padding: 13px 14px; cursor: pointer; text-align: center; }
  .staff small { display: block; font-weight: 500; font-size: 11px; opacity: .8; margin-top: 2px; }
  .staff[data-state="confirm"] { background: #E3CC98; }
  .staff[data-state="done"] { background: transparent; color: var(--on-forest); border: 1px dashed rgba(242,245,243,.45); cursor: default; }
  .alt { margin: 14px 0 0; font-size: 13px; color: var(--muted); }

  /* letter */
  .letter { margin-top: 40px; }
  .phases { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  .ph { width: 14px; height: 14px; border-radius: 50%; background: var(--line); position: relative; overflow: hidden; }
  .ph::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--moon); clip-path: inset(0 0 0 var(--cut)); }
  .letter h3 { font-family: var(--display); font-size: 22px; line-height: 1.35; margin: 0 0 4px; text-wrap: balance; }
  .note-en { font-size: 12px; color: var(--muted); font-style: italic; margin: 0 0 12px; }
  .letter p.body { margin: 12px 0 0; font-size: 15px; line-height: 1.8; }
  .sign { margin-top: 16px; font-family: var(--display); font-size: 15px; color: var(--muted); }

  /* review links */
  .review { margin-top: 28px; }
  .review-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
  .links { display: grid; gap: 10px; }
  .link { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-weight: 500; min-height: 52px; }
  .link .go { color: var(--muted); font-size: 18px; line-height: 1; }
  .link[aria-disabled="true"] { color: var(--muted); background: var(--chip); border-style: dashed; pointer-events: none; }
  .link[aria-disabled="true"] .go { font-size: 12px; }
  .link .lead-in { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .link .ico { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); color: var(--forest); }
  .link .ico svg { width: 18px; height: 18px; display: block; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .link .ico { color: var(--moon); } }
  :root[data-theme="dark"] .link .ico { color: var(--moon); }
  .link[aria-disabled="true"] .ico { background: transparent; }

  .fine { margin-top: 18px; background: var(--chip); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--ink); }
  footer { margin-top: 32px; text-align: center; color: var(--muted); font-size: 12px; letter-spacing: .08em; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="bar">
      <div class="mark">BOREUMSUP<small>보름숲 · 满月林</small></div>
      <nav class="langs" aria-label="Language">
        <button type="button" id="lang-zh" data-lang="zh" aria-pressed="false">中文</button>
        <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
      </nav>
    </div>
    <div class="moon" aria-hidden="true"></div>
    <h1 data-t="hero"></h1>
    <p class="lead" data-t="lead"></p>
  </header>

  <main>
    <section class="card" aria-labelledby="wine-title">
      <div class="eyebrow">Welcome Wine</div>
      <h2 id="wine-title" data-t="title"></h2>
      <div class="show">
        <div class="show-title" data-t="show"></div>
        <div class="clock">
          <span class="clock-label" data-t="clock"></span>
          <span class="clock-time" id="clock">--</span>
        </div>
        <button type="button" class="staff" id="staff-btn" data-state="ready"></button>
      </div>
      <p class="alt" data-t="alt"></p>
    </section>

    <article class="letter" aria-labelledby="letter-title">
      <div class="phases" aria-hidden="true">
        <span class="ph" style="--cut:85%"></span>
        <span class="ph" style="--cut:65%"></span>
        <span class="ph" style="--cut:45%"></span>
        <span class="ph" style="--cut:22%"></span>
        <span class="ph" style="--cut:0%"></span>
      </div>
      <h3 id="letter-title" data-t="lt"></h3>
      <p class="note-en" id="note-en" hidden>Boreum (보름) means "full moon" in Korean.</p>
      <div id="letter-body"></div>
      <div class="sign" data-t="sign"></div>
    </article>

    <section class="review" aria-label="Reviews">
      <div class="review-label" data-t="rl"></div>
      <div class="links" id="links"></div>
      <div class="fine" data-t="fine"></div>
    </section>
  </main>

  <footer>BOREUMSUP · JEJU</footer>
</div>

<script>
  /* ===== 설정 =====
     LINKS: 매장 리뷰 페이지 주소 (google = 비즈니스 프로필 > 리뷰 받기에서 발급한 공식 리뷰 링크)
     GA_ID: Google Analytics 4 측정 ID (예: "G-XXXXXXX"). 외부 호스팅에 올렸을 때만 작동합니다. */
  const LINKS = { naver: "https://naver.me/F1r2T6Oy", google: "https://share.google/WrmqrnarodhqoMafY", dianping: "https://m.dianping.com/shopinfo/H3uxKhJFgEYGxx9h" };
  const GA_ID = "";
  /* SHEET_URL: 구글 시트 Apps Script 웹 앱 주소 (https://script.google.com/macros/s/…/exec) */
  const SHEET_URL = "https://script.google.com/macros/s/AKfycbw5jWys0O6Qa_RklCae_pIfmxWKpxOSTElwV6np4a4WtypmFoWpXGX_pwSI2NNbnLPY4g/exec";

  const ICONS = {
    naver: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>',
    google: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.6L12 16.6l-5.1 2.6 1-5.6-4.1-4 5.7-.8z"/></svg>',
    dianping: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-7l-4.5 3.5v-3.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01" stroke-width="2.4" stroke-linecap="round"/></svg>'
  };
  const NAMES = {
    zh: { naver: "NAVER 地图", google: "Google 地图", dianping: "大众点评" },
    en: { naver: "Naver Map", google: "Google Maps", dianping: "Dianping 大众点评" }
  };
  const ORDER = { zh: ["dianping", "google", "naver"], en: ["google", "dianping", "naver"] };

  const T = {
    zh: {
      hero: "用餐时\n来一杯葡萄酒吧",
      lead: "满月林为今天到店的客人免费赠送一杯店家精选葡萄酒。",
      title: "免费赠送一杯葡萄酒",
      show: "请向服务员出示此页面",
      clock: "供服务员确认 · 当前时间",
      alt: "驾车及未满19岁的客人，我们将改为提供无酒精饮品。",
      lt: "如同再次盈满的月亮",
      letter: [
        "月亮并非每天都是圆的。它会一点点亏缺，再慢慢盈满，成为满月。",
        "满月林也在每天一点一点地充实自己。填补那些空缺的，是客人们讲给我们听的故事。",
        "我们的员工每天都会一起阅读评价，讨论如何让您的下一次到访比今天更好。",
        "不用写很长。今天最难忘的一件事，一句话就足够了。",
        "今天在满月林度过的时光如何？方便的时候，哪怕是旅行结束之后，也请告诉我们。您的故事会传递给下一位坐在这轮月亮下的客人，也会传递给再次光临的客人。"
      ],
      sign: "谢谢。满月林 敬上",
      rl: "留下评价",
      fine: "无论是否留下评价，均可获赠葡萄酒。",
      soon: "链接准备中"
    },
    en: {
      hero: "Pair your meal\nwith a glass of wine",
      lead: "Boreumsup welcomes today's guests with a complimentary glass of house wine.",
      title: "A glass of house wine, on us",
      show: "Show this screen to our staff",
      clock: "For staff · current time",
      alt: "Driving or under 19? We'll serve you a non-alcoholic drink instead.",
      lt: "Like the moon, filling again",
      letter: [
        "The moon isn't full every night. It wanes little by little, then fills again until it becomes a full moon.",
        "Boreumsup is filling up a little more each day, too. What fills the empty spaces are the stories our guests share with us.",
        "Our team reads your reviews together every day and talks about how to make your next visit better than today.",
        "It doesn't have to be long. Just one line about what you remember most from today is plenty.",
        "How was your time at Boreumsup today? Whenever it suits you, even after your trip, please tell us. Your story will reach the next guest who sits beneath this moon, and the guests who come back to see us again."
      ],
      sign: "Thank you. From all of us at Boreumsup",
      rl: "Leave a review",
      fine: "Your glass of wine is complimentary whether or not you leave a review.",
      soon: "Link coming soon"
    }
  };

  /* ===== 측정 (GA4) =====
     page_view: 자동 / wine_redeem: 직원이 '제공 완료'를 누를 때 / review_click: 후기 버튼을 누를 때 (platform 값 포함) */
  function loadAnalytics() {
    if (!GA_ID) return;
    try {
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag("js", new Date());
      window.gtag("config", GA_ID);
      const s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(GA_ID);
      document.head.appendChild(s);
    } catch (e) {}
  }
  /* 방문 ID(같은 탭에서 새로고침해도 유지), 위치 코드(?loc=), 기기 */
  const SID = (function () {
    try { let v = sessionStorage.getItem("bs-sid"); if (!v) { v = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); sessionStorage.setItem("bs-sid", v); } return v; }
    catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  })();
  const LOC = (function () { try { return new URLSearchParams(location.search).get("loc") || ""; } catch (e) { return ""; } })();
  const DEVICE = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? "iOS" : /Android/i.test(navigator.userAgent) ? "Android" : "PC/기타";

  function track(name, params) {
    const data = Object.assign({ event: name, lang: lang, loc: LOC, sid: SID, device: DEVICE }, params || {});
    try { if (window.gtag) window.gtag("event", name, data); } catch (e) {}
    if (!SHEET_URL) return;
    try {
      /* JSON 텍스트로 보냄 (와인창고와 같은 방식 — 폼 형식은 구글이 400으로 거절함) */
      fetch(SHEET_URL, { method: "POST", mode: "no-cors", keepalive: true,
        headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(data) }).catch(function () {});
    } catch (e) {}
  }

  let lang = "en";

  function pickInitial() {
    try { const saved = localStorage.getItem("bs-lang"); if (saved && T[saved]) return saved; } catch (e) {}
    const nav = (navigator.languages && navigator.languages[0]) || navigator.language || "ko";
    if (/^zh/i.test(nav)) return "zh";
    return "en";
  }

  function setLines(el, text) {
    el.textContent = "";
    text.split("\n").forEach((line, i) => { if (i) el.appendChild(document.createElement("br")); el.appendChild(document.createTextNode(line)); });
  }

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
    document.querySelectorAll("[data-t]").forEach(el => setLines(el, t[el.getAttribute("data-t")]));
    document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    document.getElementById("note-en").hidden = lang !== "en";

    const body = document.getElementById("letter-body");
    body.textContent = "";
    t.letter.forEach(par => { const p = document.createElement("p"); p.className = "body"; p.textContent = par; body.appendChild(p); });

    const box = document.getElementById("links");
    box.textContent = "";
    ORDER[lang].forEach(key => {
      const a = document.createElement("a");
      a.className = "link";
      a.id = "link-" + key;
      const name = document.createElement("span"); name.className = "lead-in";
      const ico = document.createElement("span"); ico.className = "ico"; ico.setAttribute("aria-hidden", "true"); ico.innerHTML = ICONS[key];
      const label = document.createElement("span"); label.textContent = NAMES[lang][key];
      name.append(ico, label);
      const go = document.createElement("span"); go.className = "go"; go.setAttribute("aria-hidden", "true");
      if (LINKS[key]) {
        a.href = LINKS[key]; a.target = "_blank"; a.rel = "noopener"; go.textContent = "›";
        a.addEventListener("click", () => track("review_click", { platform: key }));
      } else {
        a.setAttribute("aria-disabled", "true"); go.textContent = t.soon;
      }
      a.append(name, go);
      box.appendChild(a);
    });
    renderStaff();
    tick();
  }

  /* ===== 직원 '제공 완료' 버튼 (직원용이라 한국어 고정) =====
     한 번 누르면 확인 단계, 3초 안에 한 번 더 누르면 완료. 같은 휴대폰에서는 오늘 하루 '제공 완료'로 표시됩니다. */
  const staffBtn = document.getElementById("staff-btn");
  let confirmTimer = null;
  function todayKey() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function readRedeemed() {
    try { const v = JSON.parse(localStorage.getItem("bs-redeemed") || "null"); return v && v.day === todayKey() ? v : null; } catch (e) { return null; }
  }
  function renderStaff() {
    const r = readRedeemed();
    staffBtn.textContent = "";
    const main = document.createElement("span");
    const sub = document.createElement("small");
    if (r) {
      staffBtn.dataset.state = "done"; staffBtn.disabled = true;
      main.textContent = "✓ 와인 제공 완료 " + r.time;
      sub.textContent = "오늘 이 휴대폰으로 이미 제공되었습니다";
    } else if (staffBtn.dataset.state === "confirm") {
      staffBtn.disabled = false;
      main.textContent = "한 번 더 누르면 제공 완료";
      sub.textContent = "직원 전용";
    } else {
      staffBtn.dataset.state = "ready"; staffBtn.disabled = false;
      main.textContent = "와인 제공 완료";
      sub.textContent = "직원 전용 · 제공 후 눌러주세요";
    }
    staffBtn.append(main, sub);
  }
  staffBtn.addEventListener("click", () => {
    if (readRedeemed()) return;
    if (staffBtn.dataset.state !== "confirm") {
      staffBtn.dataset.state = "confirm"; renderStaff();
      clearTimeout(confirmTimer);
      confirmTimer = setTimeout(() => { if (staffBtn.dataset.state === "confirm") { staffBtn.dataset.state = "ready"; renderStaff(); } }, 3000);
      return;
    }
    clearTimeout(confirmTimer);
    const now = new Date();
    const time = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    try { localStorage.setItem("bs-redeemed", JSON.stringify({ day: todayKey(), time })); } catch (e) {}
    staffBtn.dataset.state = "done";
    track("wine_redeem");
    renderStaff();
    if (!readRedeemed()) { staffBtn.disabled = true; staffBtn.textContent = "✓ 와인 제공 완료 " + time; }
  });

  function tick() {
    const now = new Date();
    const loc = lang === "zh" ? "zh-CN" : "en-US";
    const d = now.toLocaleDateString(loc, { month: "short", day: "numeric", weekday: "short" });
    const tm = now.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    document.getElementById("clock").textContent = d + "  " + tm;
  }

  document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("bs-lang", lang); } catch (e) {}
    render();
  }));

  lang = pickInitial();
  loadAnalytics();
  render();
  track("visit");
  setInterval(tick, 1000);
</script>
</body>
</html>
